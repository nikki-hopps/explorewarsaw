# Netlify settings: publish the landing page and run the e-book delivery functions.
[build]
  publish = "landing"
  functions = "netlify/functions"

# Skip the build (and its credits) when a commit changes nothing the live site uses, for example notes or docs.
# Exit code 0 means "nothing relevant changed, skip"; 1 means "build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- landing netlify netlify.toml package.json"
